body{
  font-family: Metropolis;
}

.audioClipWithImage {
  display: grid;
  grid-template-columns: auto 1fr; 
  grid-template-rows: 1fr auto; 
 /* gap: 12px;*/
  background:#18453b;
  max-width: 600px;
  height: auto; 
  min-height: 0; 
  overflow: hidden; 
}

.audioClipWithImage__image {
  grid-column: 1;
  grid-row: 1 / span 5;
  height: 100%;
  max-height: 100%; 
  width: auto;
  object-fit: cover; 
  display: block; 
}



.audioClipWithImage__title{
   grid-column: 2;
  grid-row: 1;  
  	padding: 1.5rem .5rem .5rem;
	font-size: 1.5rem;
	color: #7bbd00;
}

.audioClipWithImage__person{
  grid-column: 2;
  grid-row: 2;
	padding: 0 .5rem;
  font-size: .85rem;
	color: #fff;
}

.audioClipWithImage__waveformContainer {
  grid-column: 2;
  grid-row: 3;
  min-height: 0; /* Prevents WaveSurfer from pushing height */
  width: 100%;
  box-sizing: border-box;
  padding: 0 .5rem;
}


.audioClipWithImage__transcript{
  grid-column: 2;
  grid-row: 4;
  width: 100%;
}

.audioClipWithImage__transcript a {
	color: #fff;
	padding: 0 .5rem .5rem;
	display: block;
}

.audioClipWithImage__controls {
  grid-column: 2;
  grid-row: 5;
  width: 100%;
  height: 40px;
}

.audioClipWithImage.audioClipWithImage-vertical {
	max-width: 300px;
}

.audioClipWithImage.audioClipWithImage-vertical{
   grid-template-columns: 1fr;
      grid-template-rows: repeat(1, 1fr); 
}


.audioClipWithImage.audioClipWithImage-vertical .audioClipWithImage__image{
  	grid-column: 1;
	grid-row: 1;
  width: 100%;
}

.audioClipWithImage.audioClipWithImage-vertical .audioClipWithImage__title {
	grid-column: 1;
	grid-row: 2;
	padding: 1.5rem .5rem .5rem;
	font-size: 1.5rem;
	color: #7bbd00;
}


.audioClipWithImage.audioClipWithImage-vertical  .audioClipWithImage__person {
	grid-column: 1;
	grid-row: 3;
}

.audioClipWithImage.audioClipWithImage-vertical .audioClipWithImage__waveformContainer {
	grid-column: 1;
	grid-row: 4;
}

.audioClipWithImage.audioClipWithImage-vertical .audioClipWithImage__transcript{
	grid-column: 1;
	grid-row: 5;
}

.audioClipWithImage.audioClipWithImage-vertical   .audioClipWithImage__controls {
	grid-column: 1;
	grid-row: 6;
}

@media screen and (max-width: 600px) {
.audioClipWithImage.audioClipWithImage-horizontal {
  	max-width: 300px;
    grid-template-columns: 1fr;
      grid-template-rows: auto;
  }

  .audioClipWithImage.audioClipWithImage-horizontal > * {
    grid-column: 1;
  }

  .audioClipWithImage.audioClipWithImage-horizontal .audioClipWithImage__image {
	grid-row: 1;
  width: 100%;
  height: auto;     
  display: block;
}

  .audioClipWithImage.audioClipWithImage-horizontal .audioClipWithImage__title {
	grid-row: 2;
	padding: 1.5rem .5rem .5rem;
	font-size: 1.5rem;
	color: #7bbd00;
}

  .audioClipWithImage.audioClipWithImage-horizontal .audioClipWithImage__person {
	grid-row: 3;
  }

.audioClipWithImage.audioClipWithImage-horizontal .audioClipWithImage__waveformContainer {
	grid-row: 4;
}

.audioClipWithImage.audioClipWithImage-horizontal .audioClipWithImage__transcript{
	grid-row: 5;
}

  .audioClipWithImage.audioClipWithImage-horizontal .audioClipWithImage__controls {
	grid-row: 6;
}
}

<body>

<div class="audioClipWithImage audioClipWithImage-horizontal">
    <img class="audioClipWithImage__image" src="image.png" alt="Seth Jacobson" />
    <div class="audioClipWithImage__title">How to stop an asteroid</div>
    <div class="audioClipWithImage__person">with Seth Jacobson, Assistant Professor in the Department of Earth and Environmental Sciences</div>
    <div class="audioClipWithImage__waveformContainer" id="waveform-container-0"><!--waveform will go here--></div>
    <div class="audioClipWithImage__transcript"><a target="_blank" href="#">Download transcript</a></div>
    <audio class="audioClipWithImage__controls" id="my-audio" controls>
        <source src="mp3.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
</div>

<div class="audioClipWithImage audioClipWithImage-vertical">
    <img class="audioClipWithImage__image" src="image.png" alt="Seth Jacobson" />
    <div class="audioClipWithImage__title">How to stop an asteroid</div>
    <div class="audioClipWithImage__person">with Seth Jacobson, Assistant Professor in the Department of Earth and Environmental Sciences</div>
    <div class="audioClipWithImage__waveformContainer" id="waveform-container-1"><!--waveform will go here--></div>
    <div class="audioClipWithImage__transcript"><a target="_blank" href="#">Download transcript</a></div>
    <audio class="audioClipWithImage__controls" id="my-audio2" controls>
        <source src="mp3.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
</div>

<script type="module">
import WaveSurfer from 'https://cdn.jsdelivr.net/npm/wavesurfer.js@7/dist/wavesurfer.esm.js'

//const audioElement = document.getElementById('my-audio');
const audioElements = document.querySelectorAll('.audioClipWithImage__controls');



audioElements.forEach((element, index) => {
  // Initialize WaveSurfer
const wavesurfer = WaveSurfer.create({
  container: `#waveform-container-${index}`,
  waveColor: '#0B9A6D',
  progressColor: '#FFFFFF',
  cursorColor: 'transparent',
  // Pass the HTMLMediaElement directly here
  media: element, 
    // Set a bar width
  barWidth: 2,
  // Optionally, specify the spacing between bars
  barGap: 1,
  // And the bar radius
  barRadius: 2,
});
});
